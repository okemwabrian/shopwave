services:
  postgres:
    image: postgres:16
    container_name: shopwave-db
    environment:
      POSTGRES_DB: shopwave
      POSTGRES_USER: shopwave
      POSTGRES_PASSWORD: shopwave123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shopwave-redis
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    container_name: shopwave-adminer
    ports:
      - "8090:8080"

volumes:
  pgdata: